name: Reproduce macOS Python 3.12 failure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce macOS Python 3.12 failure
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix-10995-tempo-forecaster

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Display environment information
        run: |
          python --version
          python -c "import platform; print('Platform:', platform.platform()); print('Architecture:', platform.machine())"
          uv --version

      - name: Install sktime dependencies
        run: |
          uv pip install --system ".[all_extras,dev,dl,compatibility_tests]" --no-cache-dir

      - name: Inspect installed dependency versions
        run: |
          python - <<'PY'
          import sys
          import torch
          import skbase
          import lightning

          print("Python:", sys.version)
          print("PyTorch:", torch.__version__)
          print("scikit-base:", skbase.__version__)
          print("Lightning:", lightning.__version__)

          func = torch.backends.mps.is_available
          print("MPS available:", func())
          print("MPS function type:", type(func))
          print("Has __wrapped__:", hasattr(func, "__wrapped__"))
          PY

      - name: Test Lightning import independently
        run: |
          python - <<'PY'
          import torch

          def inspect_mps(label):
              func = torch.backends.mps.is_available
              print(f"\n{label}")
              print("Function:", func)
              print("Type:", type(func))
              print("Has __wrapped__:", hasattr(func, "__wrapped__"))

          inspect_mps("BEFORE Lightning import")

          import lightning.pytorch.callbacks

          inspect_mps("AFTER Lightning import")
          PY

      - name: Inspect PatchTST get_test_params independently
        run: |
          python - <<'PY'
          import traceback
          import torch

          from sktime.forecasting.patch_tst import PatchTSTForecaster

          def inspect_mps(label):
              func = torch.backends.mps.is_available
              print(f"\n{label}")
              print("Function:", func)
              print("Type:", type(func))
              print("Has __wrapped__:", hasattr(func, "__wrapped__"))

          inspect_mps("BEFORE PatchTST get_test_params")

          try:
              result = PatchTSTForecaster.get_test_params()
              print("\nPatchTST get_test_params completed.")
              print("Result type:", type(result))
              print("Number of parameter sets:", len(result))
          except Exception:
              print("\nPatchTST get_test_params FAILED")
              traceback.print_exc()
              raise

          inspect_mps("AFTER PatchTST get_test_params")
          PY

      - name: Reproduce estimator sequence up to PatchTST
        run: |
          python - <<'PY'
          import traceback
          import torch
          from sktime.registry import all_estimators

          def mps_state():
              func = torch.backends.mps.is_available
              return {
                  "type": type(func).__name__,
                  "has_wrapped": hasattr(func, "__wrapped__"),
              }

          all_ests = all_estimators()
          total = len(all_ests)

          print(f"Total estimators: {total}", flush=True)

          previous = None

          for index, (name, estimator) in enumerate(all_ests, start=1):
              before = mps_state()

              print(
                  f"\n[{index}/{total}] Testing {name}",
                  flush=True,
              )
              print(f"MPS before: {before}", flush=True)

              try:
                  # Same condition used by test_excluded_tests_by_test.
                  if (
                      (
                          len(estimator.get_test_params()) < 2
                          or isinstance(
                              estimator.get_test_params(),
                              dict,
                          )
                      )
                      and (
                          len(estimator.get_param_names())
                          - len(
                              estimator.get_class_tags().get(
                                  "reserved_params",
                                  [],
                              )
                          )
                          > 0
                      )
                  ):
                      pass

              except Exception:
                  print("\n========== FAILURE ==========", flush=True)
                  print(f"Estimator: {name}", flush=True)
                  print(f"Previous estimator: {previous}", flush=True)
                  print(f"MPS before: {before}", flush=True)
                  print(f"MPS after: {mps_state()}", flush=True)
                  traceback.print_exc()
                  raise

              after = mps_state()

              if before != after:
                  print(
                      f"\nMPS STATE CHANGED BY: {name}",
                      flush=True,
                  )
                  print(f"Before: {before}", flush=True)
                  print(f"After: {after}", flush=True)

              previous = name

              if name == "PatchTSTForecaster":
                  print(
                      "\nReached PatchTSTForecaster successfully.",
                      flush=True,
                  )
                  break

          print("\nSequence diagnostic completed.", flush=True)
          PY

      - name: Run original failing test
        if: success()
        run: |
          pytest -n 0 sktime/tests/tests/test_test_utils.py::test_excluded_tests_by_test -vv