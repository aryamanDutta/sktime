name: PatchTST macOS MPS diagnostic

on:
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}

jobs:
  patchtst-mps-diagnostic:
    name: PatchTST diagnostic on macOS Python 3.10
    runs-on: macos-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install OSX packages
        run: ./.github/scripts/install_osx_dependencies.sh

      - name: Install sktime with development dependencies
        run: uv pip install .[dev]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Install pinned PatchTST dependencies
        run: |
          uv pip install \
            "torch==2.14.1" \
            "transformers==5.20.2" \
            "accelerate==1.15.0"
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Verify dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version

          expected = {
              "torch": "2.14.1",
              "transformers": "5.20.2",
              "accelerate": "1.15.0",
          }

          for package, expected_version in expected.items():
              installed_version = version(package)
              print(f"{package}=={installed_version}")
              if installed_version != expected_version:
                  raise RuntimeError(
                      f"Expected {package}=={expected_version}, "
                      f"found {installed_version}"
                  )
          PY

      - name: Run PatchTST diagnostic test
        run: >-
          python -m pytest -n 0
          sktime/forecasting/tests/test_patch_tst.py
          -q
          --log-cli-level=WARNING
